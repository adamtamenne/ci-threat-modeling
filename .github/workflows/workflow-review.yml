name: Workflow Security Review

on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Scan workflows for security misconfigurations
        run: |
          python scan_workflows.py \
            --summary-out workflow-summary.md \
            --json-out workflow-findings.json \
            --sarif-out workflow-findings.sarif

      - name: Post PR comment with findings
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('workflow-summary.md')) return;
            const body = fs.readFileSync('workflow-summary.md', 'utf8');
            if (!body.trim()) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-security-findings
          path: |
            workflow-findings.json
            workflow-findings.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: workflow-findings.sarif
          category: scan-workflows
